name: Security CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Generate ephemeral smoke-test secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OTP_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY_VERSION=1" >> "$GITHUB_ENV"
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run server, authorization, encryption, and payment regression tests
        working-directory: server
        run: npm test
      - name: Validate versioned migrations
        working-directory: server
        run: npm run migrate:check
      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build client
        working-directory: client
        run: npm run build
      - name: Start server and check health
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5050
          REDIS_ENABLED: false
        run: |
          npm start > /tmp/myajo-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:5050/api/health; then exit 0; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat /tmp/myajo-smoke.log; exit 1; fi
            sleep 1
          done
          cat /tmp/myajo-smoke.log
          exit 1
      - name: Audit client dependencies
        working-directory: client
        # Capacitor's CLI is build tooling and is not shipped in the web bundle.
        # Audit only production dependencies here; builds still exercise the CLI.
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history, branches and tags
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            git --config=/repo/.gitleaks.toml --redact --verbose --log-opts="--full-history --all --diff-filter=tuxdb" /repo

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and synchronize Capacitor Android
        working-directory: client
        env:
          VITE_API_BASE_URL: https://www.my-ajo.org
          VITE_PUBLIC_BASE_URL: https://www.my-ajo.org
          ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON_B64" ]; then
            node -e "require('fs').writeFileSync('android/app/google-services.json', Buffer.from(process.env.ANDROID_GOOGLE_SERVICES_JSON_B64, 'base64'))"
          fi
          npm ci
          npm run build -- --mode mobile
          npx cap sync android
          npm run mobile:patch-assets
          npm run cap:clean-flatdir
      - name: Compile Android debug APK and release bundle
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon
      - name: Upload Android build outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs
          if-no-files-found: error
          path: |
            client/android/app/build/outputs/apk/debug/app-debug.apk
            client/android/app/build/outputs/bundle/release/app-release.aab

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install and synchronize Capacitor iOS
        working-directory: client
        env:
          VITE_API_BASE_URL: https://www.my-ajo.org
          VITE_PUBLIC_BASE_URL: https://www.my-ajo.org
          IOS_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$IOS_GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            node -e "require('fs').writeFileSync('ios/App/App/GoogleService-Info.plist', Buffer.from(process.env.IOS_GOOGLE_SERVICE_INFO_PLIST_B64, 'base64'))"
          fi
          npm ci
          npm run build -- --mode mobile
          npx cap sync ios
          npm run mobile:patch-assets
      - name: Compile iOS simulator application
        working-directory: client/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
